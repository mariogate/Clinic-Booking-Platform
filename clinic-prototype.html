 bk(){const q=X.s.toLowerCase();let r=appts().filter(x=>(!X.f1||x.st==X.f1)&&(X.f2===""||x.gci==+X.f2)&&(X.f3=="up"?x.k>=TK:X.f3=="past"?x.k<TK:true)&&(!q||(x.pn+" "+dname(x.di)+" "+x.id).toLowerCase().includes(q)));
  const n=r.length;if(X.f3!="up")r.reverse();r=r.slice(0,60);
  return tbl(["Ref","When","Patient","Doctor","Clinic","Status","Source"],r.map(x=>[[x.id,fdt(x.k)+" "+x.tm,x.pn,dname(x.di),short(x.gci),tg(x.st),x.src],`openM('ap','${x.id}')`]),"No bookings match these filters. Clear the search or change the filters.")+(n>60?`<p class="m">Showing 60 of ${n}. Refine the filters to narrow the list.</p>`:"")},
 dr(){const q=X.s.toLowerCase();const r=docs().filter(i=>(!X.f1||dst(i)==X.f1)&&(X.f2===""||pw.D[i].s==+X.f2)&&(!q||dname(i).toLowerCase().includes(q)));
  return tbl(["Doctor","Specialty","Clinics","Fee (EGP)","Rating","Listing"],r.map(i=>[[dname(i),pw.SP[pw.D[i].s].n.en,pw.D[i].c.map(short).join(" / "),pw.D[i].f,"★ "+pw.D[i].r,`<span class="tag ${dst(i)=="verified"?"st-scheduled":dst(i)=="pending"?"st-no_show":"st-cancelled"}">${dst(i)}</span>`],`openM('dr',${i})`]),"No doctors match these filters.")},
 pt(){const q=X.s.toLowerCase();const r=pats().filter(p=>(!X.f1||(X.f1=="watch"?p.ns>=2:p.ns<2))&&(!q||(p.n+p.id).toLowerCase().includes(q)));
  return tbl(["ID","Patient","Bookings","Upcoming","No-shows","Cancellations","Flag"],r.map(p=>[[p.id,p.n,p.b,p.up,p.ns,p.cx,p.ns>=2?`<span class="tag st-no_show">Repeated no-shows</span>`:"–"],`openM('pt','${p.id}')`]),"No patients match. Patients appear here once they have a booking.")},
 cl(){const q=X.s.toLowerCase();const a=appts();const r=clins().filter(i=>(!X.f1||X.cx[i].status==X.f1)&&(!q||CLn(i).toLowerCase().includes(q)));
  return tbl(["Clinic","Phone","Doctors","Upcoming bookings","Status"],r.map(i=>[[CLn(i),X.cx[i].phone,pw.D.filter(d=>d.c.includes(i)).length,a.filter(x=>x.gci==i&&x.st=="scheduled"&&x.k>=TK).length,`<span class="tag ${X.cx[i].status=="active"?"st-scheduled":"st-cancelled"}">${X.cx[i].status}</span>`],`openM('cl',${i})`]),"No clinics match.")}};
const srch=ph=>`<input type="search" placeholder="${ph}" value="${esc(X.s)}" oninput="X.s=this.value;upd()" aria-label="${ph}">`;
const sel=(f,o,all)=>`<select onchange="X.${f}=this.value;upd()" aria-label="${all}"><option value="">${all}</option>${o.map(([v,l])=>`<option value="${v}" ${X[f]==v?"selected":""}>${l}</option>`).join("")}</select>`;
/* ---- views ---- */
const V={
 ov(){const r=appts(),e=evs(),ds=docs(),off=dw.S.off;
  const C=[[pats().length,"Total patients"],[ds.filter(i=>dst(i)=="verified").length,"Active doctors"],[clins().length,"Clinics"],[r.filter(x=>x.st=="scheduled"&&x.k>=TK).length,"Upcoming bookings"],[r.filter(x=>x.st=="cancelled").length,"Cancellations"],[r.filter(x=>x.st=="no_show").length,"No-shows"],[e.filter(x=>!x.read).length,"Unread notifications"],[e.filter(x=>x.status!="resolved").length,"Open follow-ups"]];
  return `<h2>Overview</h2><div class="stats">${C.map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("")}</div>
  <p class="m">Booking data covers Dr. Karim Adel’s synthetic schedule plus bookings made in the patient app. Other doctors have no schedules yet.</p>
  <h3 style="margin-top:14px">Latest notifications</h3>${e.slice(0,4).map(cardE).join("")||`<p class="m">None yet. Mark a no-show, cancel an appointment or set a day off in the Doctor dashboard.</p>`}
  <h3 style="margin-top:14px">Doctor days off</h3>${Object.keys(off).sort().map(k=>`<p class="m"><b>${fdt(k)}</b> · Dr. Karim Adel · ${esc(off[k])}</p>`).join("")||`<p class="m">No days off set.</p>`}`},
 nt(){const l=evs().filter(e=>(!X.f1||e.status==X.f1)&&(!X.f2||e.kind==X.f2));
  return `<div class="bar"><h2 style="margin:0">Notification center</h2><button class="gh" onclick="readAll()">Mark all read</button></div><div class="row" style="margin-bottom:10px">${sel("f1",Object.entries(FL),"All statuses").replace("upd()","draw()")}${sel("f2",Object.entries(KL),"All types").replace("upd()","draw()")}</div>`+
  (l.length?l.map(cardE).join(""):`<div class="box"><p class="m">${evs().length?"No notifications match these filters.":"No notifications yet. Open the Doctor dashboard and mark a no-show, cancel an appointment or set a day off. The event arrives here."}</p></div>`)},
 bk(){return `<h2>Bookings</h2><div class="row" style="margin-bottom:10px">${srch("Search patient, doctor or reference")}${sel("f1",Object.entries(LB),"All statuses")}${plat()?sel("f2",[0,1,2,3].map(i=>[i,short(i)]),"All clinics"):""}<select onchange="X.f3=this.value;upd()" aria-label="Period">${[["up","Upcoming"],["past","Past"],["","All dates"]].map(([v,l])=>`<option value="${v}" ${X.f3==v?"selected":""}>${l}</option>`).join("")}</select></div><div id="tb">${TB.bk()}</div>`},
 dr(){return `<h2>Doctors</h2><div class="row" style="margin-bottom:10px">${srch("Search doctor")}${sel("f2",pw.SP.map((s,i)=>[i,s.n.en]),"All specialties")}${sel("f1",[["verified","Verified"],["pending","Pending"],["suspended","Suspended"]],"All listings")}</div><div id="tb">${TB.dr()}</div>`},
 pt(){return `<h2>Patients</h2><p class="m">Administrators see booking activity only. Clinical history stays in the doctor workspace.</p><div class="row" style="margin:10px 0">${srch("Search name or ID")}${sel("f1",[["watch","Repeated no-shows"],["ok","No flag"]],"All patients")}</div><div id="tb">${TB.pt()}</div>`},
 cl(){return `<h2>Clinics</h2><div class="row" style="margin-bottom:10px">${srch("Search clinic")}${plat()?sel("f1",[["active","Active"],["inactive","Inactive"]],"All statuses"):""}</div><div id="tb">${TB.cl()}</div>`}};
function cardE(e){return `<div class="card ${e.read?"":"unread"}" role="button" tabindex="0" onclick="openM('ev','${e.id}')" onkeydown="if(event.key==='Enter')openM('ev','${e.id}')"><div class="grow"><p style="margin:0"><span class="tag ${e.kind=="noshow"?"st-no_show":"st-cancelled"}">${KL[e.kind]}</span> ${e.urgent?`<span class="tag x">Urgent</span> `:""}${e.read?"":`<span class="tag st-scheduled">New</span>`}</p><p style="margin:2px 0"><b>${esc(e.ap.pn)}</b> · ${fdt(e.ap.k)} ${e.ap.tm} · ${short(e.gci)}</p><small class="m">${clock(e.at)} · ${ago(e.at)} · ref ${esc(e.ap.id)}</small></div><span class="tag ${FC[e.status]}">${FL[e.status]}</span></div>`}
/* ---- modals ---- */
const modal=(t,b)=>`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet" role="dialog" aria-label="${esc(t)}"><div class="bar"><h2 style="margin:0">${t}</h2><button class="gh" onclick="closeM()">Close</button></div>${X.err?`<p class="errb" role="alert">${X.err}</p>`:""}${b}</div></div>`;
function reschUI(ap,evId){const ds=[];for(let i=1;i<=14;i++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);const k=iso(d);if(d.getDay()!==5&&!dw.S.off[k])ds.push(k)}
 const used=X.rd?dw.A.filter(a=>a.k==X.rd&&a.st!="cancelled").map(a=>a.tm):[],ts=X.rd?TIMES.filter(t=>!used.includes(t)):[];
 return `<div class="box"><h3>Simulate rescheduling</h3><p class="m">Books a new slot in Dr. Karim Adel’s schedule. Free slots only; Fridays and days off are excluded.</p><div class="row" style="margin:8px 0"><select onchange="X.rd=this.value;X.rt='';draw()" aria-label="New date"><option value="">Choose date</option>${ds.map(k=>`<option value="${k}" ${X.rd==k?"selected":""}>${fdt(k)}</option>`).join("")}</select><select onchange="X.rt=this.value" aria-label="New time"><option value="">Choose time</option>${ts.map(t=>`<option ${X.rt==t?"selected":""}>${t}</option>`).join("")}</select><button class="pri" onclick="doResc('${evId}','${ap}')">Reschedule…</button></div></div>`}
function doResc(evId,ap){const old=dw.A.find(a=>a.id==ap),e=evId?ev(evId):null;
 if(!X.rd||!X.rt){X.err="Choose a new date and time first.";draw();return}
 if(!old){X.err="The original appointment could not be found.";draw();return}
 if(old.ext=="Patient app"&&old.st!="cancelled"){X.err="This booking was made in the patient app. Reschedule it from the patient app in this phase.";draw();return}
 ask("Reschedule appointment?",`${esc(old.p.n)} moves to ${fdt(X.rd)} at ${X.rt}. A patient notice is simulated; nothing is sent.`,"Reschedule (simulated)",()=>{const d=new Date(X.rd+"T00:00"),ci=[6,1,3].includes(d.getDay())?0:1;
  dw.addExt({id:"R-"+(++rn),k:X.rd,tm:X.rt,ci,p:old.p,ext:"Admin reschedule"});if(old.st=="scheduled")dw.setExt(ap,"cancelled","Rescheduled by administrator");
  if(e){e.res=fdt(X.rd)+" "+X.rt;e.status="resolved";log(e,`Rescheduled to ${e.res} (simulated). Patient notified (simulated).`)}
  X.msg=`${old.p.n} rescheduled to ${fdt(X.rd)} ${X.rt} (simulated).`;X.m=null;X.rd="";X.rt=""})}
function mEv(){const e=ev(X.m.id),a=e.ap,h=appts().filter(r=>r.pid==a.pid),ns=h.filter(r=>r.st=="no_show").length,now=dw.A.find(x=>x.id==a.id),same=e.kind=="dayoff"?BUS.ev.filter(x=>x.kind=="dayoff"&&x.ap.k==a.k&&x.id!=e.id).length:0,done=e.status=="resolved";
 let b=`<p><span class="tag ${FC[e.status]}">${FL[e.status]}</span> ${e.urgent?`<span class="tag x">Urgent: short notice</span> `:""}<small class="m">Received ${clock(e.at)} · ${ago(e.at)}</small> <button class="gh" onclick="togRead('${e.id}')">Mark as ${e.read?"unread":"read"}</button></p>`+dl([["Patient",esc(a.pn)+" ("+a.pid+", synthetic)"],["Appointment",fdt(a.k)+" at "+a.tm+" · ref "+esc(a.id)],["Doctor","Dr. Karim Adel"],["Clinic",CLn(e.gci)],["Appointment now",now?LB[now.st]+(now.reason?" · "+esc(now.reason):""):"Unknown"],["Detail",esc(e.detail)]]);
 if(e.kind=="noshow")b+=`<div class="box" style="margin-top:12px"><h3>No-show review</h3><p>${esc(a.pn)} has <b>${ns}</b> no-show(s) in ${h.length} booking(s).${ns>=2?" Repeated no-shows: consider a reminder policy notice.":""}</p></div>`;
 else b+=`<div class="box" style="margin-top:12px"><h3>${e.kind=="dayoff"?"Day off impact":"Doctor cancellation"}</h3><p>${e.kind=="dayoff"?`This booking was cancelled because the doctor marked ${fdt(a.k)} as a day off. ${same} other booking(s) on that day also need follow-up.`:"The doctor cancelled this booking. The patient needs a new time."}</p>${e.res?`<p class="flash">Rescheduled to ${e.res}.</p>`:""}</div>`;
 if(!done){if(e.kind!="noshow"&&!e.res)b+=reschUI(a.id,e.id);
  b+=`<div class="box"><h3>Contact patient (simulated)</h3><div class="row" style="margin:8px 0"><select onchange="X.ch=this.value" aria-label="Channel">${["Phone call","SMS","In-app message","Email"].map(c=>`<option ${X.ch==c?"selected":""}>${c}</option>`).join("")}</select></div><textarea oninput="X.mt=this.value" aria-label="Message">${esc(X.mt)}</textarea><p><button class="pri" onclick="sendC('${e.id}')">Send…</button> <small class="m">No real email or SMS is sent.</small></p></div>`}
 b+=`<div class="box"><h3>Follow-up status</h3><div class="row" style="margin:8px 0">${["pending","in_progress"].map(x=>`<button class="gh ${e.status==x?"on":""}" aria-pressed="${e.status==x}" onclick="setFu('${e.id}','${x}')">${FL[x]}</button>`).join("")}<button class="gh ${done?"on":""}" aria-pressed="${done}" onclick="resolveE('${e.id}')">Resolved…</button></div>${done?"":`<textarea oninput="X.rn=this.value" placeholder="Resolution note (required to resolve)" aria-label="Resolution note">${esc(X.rn)}</textarea>`}</div>`;
 b+=`<h3>Activity log</h3><ul class="l lg">${e.log.map(l=>`<li>${clock(l.at)} · ${esc(l.t)}</li>`).join("")}</ul>`;return modal(KL[e.kind],b)}
function sendC(id){const e=ev(id);if(!X.mt.trim()){X.err="Write a message before sending.";draw();return}
 ask("Contact patient?",`Simulated ${X.ch.toLowerCase()} to ${esc(e.ap.pn)}. Nothing is actually sent.`,"Send (simulated)",()=>{log(e,`Contacted ${e.ap.pn} by ${X.ch.toLowerCase()} (simulated): “${X.mt.trim()}”`);if(e.status=="pending")e.status="in_progress";X.msg="Contact recorded (simulated)."})}
function setFu(id,x){const e=ev(id);if(e.status==x)return;e.status=x;log(e,"Status changed to "+FL[x]+".");X.msg="Follow-up status: "+FL[x]+".";draw()}
function togRead(id){const e=ev(id);e.read=!e.read;paintBadge();draw()}
function resolveE(id){const e=ev(id);if(e.status=="resolved")return;if(!X.rn.trim()){X.err="Add a resolution note before resolving.";draw();return}
 ask("Resolve this follow-up?","It moves to Resolved and actions are locked.","Resolve",()=>{e.status="resolved";log(e,"Resolved: "+X.rn.trim());X.rn="";X.msg="Follow-up resolved."})}
function mAp(){const r=appts().find(x=>x.id==X.m.id);if(!r)return modal("Booking","<p>Not found.</p>");
 let b=dl([["Reference",r.id],["Patient",esc(r.pn)],["Doctor",dname(r.di)],["Clinic",CLn(r.gci)],["Date",fdt(r.k)],["Time",r.tm],["Status",tg(r.st)+(r.reason?" · "+esc(r.reason):"")],["Source",r.src]]);
 if(r.st=="scheduled"){b+=`<div class="box" style="margin-top:12px"><h3>Cancel booking</h3><div class="row" style="margin:8px 0"><select onchange="X.cr=this.value" aria-label="Reason"><option value="">Choose a reason</option>${["Clinic closed","Doctor unavailable","Duplicate booking","Patient request","Other"].map(c=>`<option ${X.cr==c?"selected":""}>${c}</option>`).join("")}</select><button class="dng" onclick="cancelB('${r.id}')">Cancel booking…</button></div></div>`;
  b+=r.di==KD?reschUI(r.id,""):`<p class="m">Rescheduling is available for Dr. Karim Adel’s schedule only in this phase.</p>`}
 return modal("Booking "+r.id,b)}
function cancelB(id){const r=appts().find(x=>x.id==id);if(!X.cr){X.err="Choose a cancellation reason first.";draw();return}
 ask("Cancel this booking?",`${esc(r.pn)} on ${fdt(r.k)} at ${r.tm}. The patient notice is simulated.`,"Cancel booking",()=>{const why="Cancelled by administrator: "+X.cr;if(r.di==KD)dw.setExt(id,"cancelled",why);const b=BUS.pb.find(x=>x.ref==id);if(b){b.st="cancelled";pw.cancelRef(id)}X.msg=`Booking ${id} cancelled (simulated notice sent).`;X.m=null})}
function mDr(){const i=X.m.id,d=pw.D[i],s=dst(i);
 let b=dl([["Specialty",pw.SP[d.s].n.en],["Clinics",d.c.map(CLn).join("; ")],["Rating","★ "+d.r],["Visible to patients",s=="verified"?"Yes":"No (not verified)"],["Listing",s]]);
 if(plat())b+=`<div class="box" style="margin-top:12px"><h3>Profile</h3><div class="row" style="margin:8px 0"><label>Fee (EGP) <input type="number" value="${esc(X.fee)}" oninput="X.fee=this.value" style="width:110px"></label><button class="pri" onclick="saveDoc(${i})">Save fee</button></div><div class="row">${s!="verified"?`<button class="pri" onclick="setDoc(${i},'verified')">${s=="pending"?"Verify and activate listing":"Reinstate"}…</button>`:`<button class="dng" onclick="setDoc(${i},'suspended')">Suspend listing…</button>`}</div></div>`;
 else b+=`<p class="warn">Read-only for clinic administrators. Only platform administrators verify doctors or change fees.</p>`;
 return modal(dname(i),b)}
function saveDoc(i){const f=+X.fee;if(!Number.isInteger(f)||f<50||f>5000){X.err="Fee must be a whole number between 50 and 5000 EGP.";draw();return}pw.D[i].f=f;pw.render();X.msg=`Fee for ${dname(i)} updated to ${f} EGP. The patient app shows it now.`;X.m=null;draw()}
function setDoc(i,s){ask(s=="suspended"?"Suspend this listing?":"Activate this listing?",s=="suspended"?`${dname(i)} disappears from patient search immediately.`:`${dname(i)} becomes visible in patient search.`,s=="suspended"?"Suspend":"Activate",()=>{pw.D[i].st=s;pw.render();X.msg=`${dname(i)} is now ${s}.`;X.m=null})}
function mCl(){const i=X.m.id,c=X.cx[i];
 const b=`<div class="box"><div class="row" style="flex-direction:column;align-items:stretch"><label>Name and district<input value="${esc(X.cn)}" oninput="X.cn=this.value" style="width:100%"></label><label>Phone<input value="${esc(X.cp)}" oninput="X.cp=this.value" style="width:100%"></label><label>Working hours<input value="${esc(X.chh)}" oninput="X.chh=this.value" style="width:100%"></label></div><p><button class="pri" onclick="saveCl(${i})">Save clinic</button></p></div>`+(plat()?`<div class="row"><span>Status: <b>${c.status}</b></span><button class="gh" onclick="togCl(${i})">${c.status=="active"?"Deactivate…":"Activate…"}</button></div><p class="m">Status is admin-side only in this phase; patient search does not use it yet.</p>`:`<p class="warn">Only platform administrators can change clinic status.</p>`);
 return modal(CLn(i),b)}
function saveCl(i){const n=X.cn.trim();if(n.length<3||n.length>60){X.err="Name must be 3 to 60 characters.";draw();return}if(!/^[0-9+ ]{8,18}$/.test(X.cp.trim())){X.err="Phone must contain 8 to 18 digits, spaces or +.";draw();return}
 pw.CL[i].en=n;const x=dClin.indexOf(i);if(x>=0)dw.CLN[x]=n;X.cx[i].phone=X.cp.trim();X.cx[i].hours=X.chh.trim();pw.render();dw.render();X.msg="Clinic saved. New name shows in the patient and doctor views.";X.m=null;draw()}
function togCl(i){const c=X.cx[i],s=c.status=="active"?"inactive":"active";ask(s=="inactive"?"Deactivate clinic?":"Activate clinic?","This is a simulated, admin-side status change.","Confirm",()=>{c.status=s;X.msg=`${short(i)} is now ${s}.`})}
function mPt(){const p=pats().find(x=>x.id==X.m.id);if(!p)return modal("Patient","<p>Not found.</p>");const d=dw.P.find(x=>x.id==p.id);
 return modal(esc(p.n),dl([["ID",p.id+" (synthetic)"],["Age",d?d.age:"–"],["Bookings",p.b],["Upcoming",p.up],["No-shows",p.ns],["Cancellations",p.cx]])+`<p class="m" style="margin-top:10px">Clinical history is not shown to administrators.</p>`)}
function draw(){if(!pw||!dw)return;const role=plat()?`<span class="tag st-completed">Platform administrator</span> <small class="m">All clinics · verifies doctors · full access</small>`:`<span class="tag st-no_show">Clinic administrator</span> <small class="m">${esc(CLn(X.role))} only · cannot verify doctors or change fees</small>`;
 const un=evs().filter(e=>!e.read).length,T=[["ov","Overview"],["nt","Notifications"+(un?` (${un})`:"")],["bk","Bookings"],["dr","Doctors"],["pt","Patients"],["cl","Clinics"]];
 const m=X.m?{ev:mEv,ap:mAp,dr:mDr,cl:mCl,pt:mPt}[X.m.k]():"";
 $("adm").innerHTML=`<div class="bar"><div>${role}</div><label class="m">Demo role (not a real login): <select onchange="setRole(this.value)">${[["P","Platform administrator"],...[0,1,2,3].map(i=>[i,"Clinic admin: "+short(i)])].map(([v,l])=>`<option value="${v}" ${String(X.role)==String(v)?"selected":""}>${l}</option>`).join("")}</select></label></div><p class="warn">Simulated: roles are not enforced by real security, and nothing is saved after refresh.</p><div class="tabs">${T.map(([k,l])=>`<button class="${X.tab==k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>${X.msg?`<p class="flash" role="status">${X.msg}</p>`:""}${V[X.tab]()}${m}${X.c?`<div class="ov c"><div class="sheet" role="alertdialog" aria-label="${esc(X.c.t)}"><h3>${X.c.t}</h3><p>${X.c.msg}</p><div class="row"><button class="pri" onclick="okC()">${X.c.ok}</button><button class="gh" onclick="X.c=null;draw()">Go back</button></div></div></div>`:""}`}
</script>
</body>
